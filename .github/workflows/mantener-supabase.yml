# El plan gratis de Supabase pausa el proyecto tras 7 días con poca actividad.
# Esta tarea hace una consulta real a la base cada 3 días para mantenerlo activo.
# Usa la clave anon (solo lee lo público) guardada en los secretos del repositorio.
# GitHub desactiva las tareas programadas de un repositorio público tras 60 días sin commits.
# El último paso le pide a GitHub mantener activa esta tarea en cada ejecución, sin hacer commits.
# Si aun así se desactivara, se reactiva en la pestaña Actions.
name: Mantener Supabase activo

on:
  schedule:
    - cron: '0 15 */3 * *' # cada 3 días a las 15:00 UTC (9:00 en Ciudad del Carmen)
  workflow_dispatch:

# Solo el permiso para mantener activa la tarea; no puede tocar el código.
permissions:
  actions: write

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar una ruta en Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Faltan los secretos SUPABASE_URL o SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          respuesta=$(curl -sS --fail-with-body --retry 3 --retry-delay 15 \
            "${SUPABASE_URL%/}/rest/v1/rutas?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          if ! echo "$respuesta" | grep -q '"id"'; then
            echo "Supabase respondió algo inesperado: $respuesta"
            exit 1
          fi
          echo "Supabase activo. Respuesta: $respuesta"

      - name: Mantener activa esta tarea en GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -sS --fail-with-body -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/mantener-supabase.yml/enable"
          echo "Tarea marcada como activa."
